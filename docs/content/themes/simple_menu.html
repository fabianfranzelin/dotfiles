<!-- Go to top button -->
<a href="#" id="go-to-top" aria-label="Go to top">&uarr;</a>
<script>
(function() {
  var btn = document.getElementById('go-to-top');
  var header = document.querySelector('header');
  if (!header || !btn) return;
  var observer = new IntersectionObserver(function(entries) {
    btn.classList.toggle('visible', !entries[0].isIntersecting);
  }, { threshold: 0 });
  observer.observe(header);
  btn.addEventListener('click', function(e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
<script>
// Build per-page section navigation from headings
document.addEventListener('DOMContentLoaded', function() {
  var container = document.getElementById('page-sections');
  if (!container) return;
  var headings = document.querySelectorAll('#content > .outline-2 > h2');
  if (headings.length < 2) return;
  headings.forEach(function(h) {
    var id = h.id || (h.parentElement && h.parentElement.id);
    if (!id) return;
    var text = h.textContent.replace(/^[\d.]+\s*/, '').trim();
    if (!text) return;
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = '#' + id;
    a.textContent = text;
    li.appendChild(a);
    container.appendChild(li);
  });
  // Highlight active section on scroll
  var links = container.querySelectorAll('a');
  if (!links.length) return;
  var sections = Array.from(links).map(function(a) {
    return document.getElementById(a.getAttribute('href').slice(1));
  }).filter(Boolean);
  function updateActive() {
    var scrollY = window.scrollY + 100;
    var active = null;
    sections.forEach(function(sec, i) {
      if (sec.offsetTop <= scrollY) active = i;
    });
    links.forEach(function(a, i) {
      a.classList.toggle('active', i === active);
    });
  }
  window.addEventListener('scroll', updateActive, { passive: true });
  updateActive();
});
</script>
<script defer src="https://unpkg.com/lunr/lunr.js"></script>
