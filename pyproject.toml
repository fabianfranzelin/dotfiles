[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "RUF",   # ruff-specific rules
]
ignore = [
  "E741",   # ambiguous variable name
]

[tool.ruff.format]
# Defaults match black style

[tool.mypy]
python_version = "3.10"
exclude = '/(site-packages|__pycache__|\..*)/$'
show_error_codes = true
warn_unused_configs = true
strict = true
implicit_reexport = true

[[tool.mypy.overrides]]
# NOTE: before adding a package to this list, check if there is a types-*
# package available, for example 'setuptools' has 'types-setuptools', see for
# example dt_launcher/setup.py
module = [
  "setuptools",
  "argcomplete",
  "git",
  "git.*",
  "numpy",
  "sphinxcontrib",
  "pydash",
]
ignore_missing_imports=true

[tool.basedpyright]
reportAny = false


