[tool.isort]
profile = "black"

[tool.mypy]
python_version = 3.8
exclude = '/(site-packages|__pycache__|\..*)/$'
show_error_codes = true
warn_unused_configs = true
strict = true
implicit_reexport = true

[[tool.mypy.overrides]]
# NOTE: before adding a package to this list, check if there is a types-*
# package available, for example 'setuptools' has 'types-setuptools', see for
# example dt_launcher/setup.py
module = [
  "setuptools",
  "argcomplete",
  "git",
  "git.*",
  "numpy",
  "sphinxcontrib",
  "pydash",
]
ignore_missing_imports=true

[tool.pylint.messages_control]

max-line-length = 100

disable = [
  "no-member",
  "invalid-name",
  "bad-whitespace",
  "bad-continuation",
  "fixme",
  "too-few-public-methods",
]