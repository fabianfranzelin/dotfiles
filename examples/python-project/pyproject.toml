[project]
name = "python-project"
version = "0.1.0"
description = "Example Python project for testing Emacs IDE features"
requires-python = ">=3.10"

dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["."]

[tool.mypy]
strict = true

[tool.black]
line-length = 88
