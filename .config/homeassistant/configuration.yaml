---
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  # For extra security set this to only accept connections on
  # localhost if NGINX is on the same machine Uncommenting this will
  # mean that you can only reach Home Assistant using the proxy, not
  # directly via IP from other clients.  server_host: 127.0.0.1
  use_x_forwarded_for: true
  # You must set the trusted proxy IP address so that Home Assistant
  # will properly accept connections Set this to your NGINX machine
  # IP, or localhost if hosted on the same machine.
  trusted_proxies:
    - 127.0.0.1       # in case the reverse proxy being on the same IPv4 as the HA    
    - ::1             # in case the reverse proxy being on the same IPv6 as the HA
    - 172.17.0.4      # nginx ip address
    - 172.0.0.0/8   # in case the reverse proxy being under the same docker environment as the HA, and in case the docker IP would change after reboot/restart

# Manual modbus integration for Trovis 5578
# Check https://github.com/Tom-Bom-badil/trovis-modbus-hass once it is working
modbus:
  - name: "Heizung"
    type: tcp
    host: 192.168.178.94
    port: 502           # Default Modbus TCP port
    sensors:
      # --- SHARED GLOBAL SYSTEM VARIABLES ---
      - name: "Trovis Outdoor Temperature (2)"
        slave: 1
        address: 2
        input_type: holding
        data_type: int16
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature

      # =========================================================================
      # SYSTEM & PHYSICAL SENSORS
      # =========================================================================
      - name: "Trovis System Model"
        slave: 1
        address: 0          # Reg 1
        input_type: holding
        data_type: uint16

      - name: "Trovis Outdoor Temperature (9)"
        slave: 1
        address: 9          # Reg 10 (AF1)
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement

      # =========================================================================
      # HEATING CIRCUIT 1 (HK1 / RK1)
      # =========================================================================
      - name: "[HK1] HK - Flow Temperature Actual"
        slave: 1
        address: 12         # Reg 13 (VF1)
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement

      - name: "[HK1] HK - Flow Temperature Setpoint"
        slave: 1
        address: 30         # Reg 31
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"

      - name: "[HK1] HK - Room Temperature Setpoint Day"
        slave: 1
        address: 31         # Reg 32
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"

      - name: "[HK1] HK - Room Temperature Setpoint Night"
        slave: 1
        address: 32         # Reg 33
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"

      - name: "[HK1] HK - Valve Position"
        slave: 1
        address: 39         # Reg 40
        input_type: holding
        data_type: int16
        unit_of_measurement: "%"

      # =========================================================================
      # HEATING CIRCUIT 2 (HK2 / RK2)
      # =========================================================================
      - name: "[HK2] BH - Flow Temperature Actual"
        slave: 1
        address: 13         # Reg 14 (VF2)
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement

      - name: "[HK2] BH - Flow Temperature Setpoint"
        slave: 1
        address: 100        # Reg 101
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"

      - name: "[HK2] BH - Room Temperature Setpoint Day"
        slave: 1
        address: 101        # Reg 102
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"

      - name: "[HK2] BH - Room Temperature Setpoint Night"
        slave: 1
        address: 102        # Reg 103
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"

      - name: "[HK2] BH - Valve Position"
        slave: 1
        address: 109        # Reg 110
        input_type: holding
        data_type: int16
        unit_of_measurement: "%"

      # =========================================================================
      # DOMESTIC HOT WATER (DHW / TWW)
      # =========================================================================
      - name: "[TWW] Storage Temperature Actual"
        slave: 1
        address: 15         # Reg 16 (SF1)
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement

      - name: "[TWW] Temperature Setpoint"
        slave: 1
        address: 240        # Reg 241
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"

      - name: "[TWW] Charging Temperature Setpoint"
        slave: 1
        address: 241        # Reg 242
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"

      - name: "[TWW] Valve Position"
        slave: 1
        address: 249        # Reg 250
        input_type: holding
        data_type: int16
        unit_of_measurement: "%"
