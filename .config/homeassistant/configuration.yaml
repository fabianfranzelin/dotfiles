---
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  # For extra security set this to only accept connections on
  # localhost if NGINX is on the same machine Uncommenting this will
  # mean that you can only reach Home Assistant using the proxy, not
  # directly via IP from other clients.  server_host: 127.0.0.1
  use_x_forwarded_for: true
  # You must set the trusted proxy IP address so that Home Assistant
  # will properly accept connections Set this to your NGINX machine
  # IP, or localhost if hosted on the same machine.
  trusted_proxies:
    - 127.0.0.1       # in case the reverse proxy being on the same IPv4 as the HA    
    - ::1             # in case the reverse proxy being on the same IPv6 as the HA
    - 172.17.0.4      # nginx ip address
    - 172.0.0.0/8   # in case the reverse proxy being under the same docker environment as the HA, and in case the docker IP would change after reboot/restart

# Manual modbus integration for Trovis 5578
# Check https://github.com/Tom-Bom-badil/trovis-modbus-hass once it is working
modbus:
  - name: "Heizung"
    type: tcp
    host: 192.168.178.94
    port: 502           # Default Modbus TCP port
    sensors:
      # --- SHARED GLOBAL SYSTEM VARIABLES ---
      - name: "Trovis Outdoor Temperature"
        unique_id: trovis_sensor_r2
        slave: 1
        address: 2
        input_type: holding
        data_type: int16
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
      # --- HK1: UNDERFLOOR HEATING (MIXED CIRCUIT) ---
      - name: "Trovis HK1 Flow Temp"
        unique_id: trovis_hk1_flow
        slave: 1
        address: 3
        input_type: holding
        data_type: int16
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
      - name: "Trovis HK1 Return Temp"
        unique_id: trovis_hk1_return
        slave: 1
        address: 4
        input_type: holding
        data_type: int16
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
      # --- HK2: RADIATORS ZONE ---
      - name: "Trovis HK2 Flow Temp"
        unique_id: trovis_hk2_flow
        slave: 1
        address: 5
        input_type: holding
        data_type: int16
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
      - name: "Trovis HK2 Return Temp"
        unique_id: trovis_hk2_return
        slave: 1
        address: 6
        input_type: holding
        data_type: int16
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
      # --- TWW: TRINKWARMWASSER (HOT WATER STORAGE) ---
      - name: "Trovis TWW Tank Temp"
        unique_id: trovis_tww_tank
        slave: 1
        address: 7
        input_type: holding
        data_type: int16
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
      # Test Option A: Standard shift next block
      - name: "Trovis TWW Temp Alt 7"
        unique_id: trovis_tww_a7
        slave: 1
        address: 7
        input_type: holding
        data_type: int16
        scale: 0.1
        unit_of_measurement: "°C"
      # Test Option B: Alternate firmware alignment sequence
      - name: "Trovis TWW Temp Alt 8"
        unique_id: trovis_tww_a8
        slave: 1
        address: 8
        input_type: holding
        data_type: int16
        scale: 0.1
        unit_of_measurement: "°C"
      # Test Option C: Extended index block mapping
      - name: "Trovis TWW Temp Alt 11"
        unique_id: trovis_tww_a11
        slave: 1
        address: 11
        input_type: holding
        data_type: int16
        scale: 0.1
        unit_of_measurement: "°C"
