- id: '1758488499252'
  alias: Fabis Schreibtisch
  description: Turns on a power plug at 7:30 AM and off at 12 AM on weekdays.
  triggers:
  - at: 07:30:00
    trigger: time
    id: Start working
  - at: 00:00:00
    trigger: time
    id: Stop working
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Start working
      sequence:
      - type: turn_on
        device_id: b2225a3e5fe01b2896595f1e1be5c806
        entity_id: 007ca7184c51dd29bf58105945cb7417
        domain: switch
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Stop working
      sequence:
      - type: turn_off
        device_id: b2225a3e5fe01b2896595f1e1be5c806
        entity_id: 007ca7184c51dd29bf58105945cb7417
        domain: switch
  mode: single
- id: '1760733577087'
  alias: Familienbad - Heizkörper
  description: Sets heating to 22°C or Off based on a weekday/weekend schedule.
  triggers:
  - at: 05:45:00
    id: weekday_morning_on
    trigger: time
  - at: 08:00:00
    id: weekday_morning_off
    trigger: time
  - at: 07:00:00
    id: weekend_morning_on
    trigger: time
  - at: 09:30:00
    id: weekend_morning_off
    trigger: time
  - at: '18:30:00'
    id: evening_on
    trigger: time
  - at: '20:00:00'
    id: evening_off
    trigger: time
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: and
          conditions:
          - condition: trigger
            id: weekday_morning_on
          - condition: time
            weekday:
            - mon
            - tue
            - wed
            - thu
            - fri
        - condition: and
          conditions:
          - condition: trigger
            id: weekend_morning_on
          - condition: time
            weekday:
            - sat
            - sun
        - condition: trigger
          id: evening_on
      sequence:
      - target:
          device_id: b0c54078707a81ed49fa6704ff58e0b2
          area_id: familienbad
        data:
          temperature: 22
          hvac_mode: heat
        action: climate.set_temperature
    - conditions:
      - condition: or
        conditions:
        - condition: and
          conditions:
          - condition: trigger
            id:
            - weekday_morning_off
          - condition: time
            weekday:
            - mon
            - tue
            - wed
            - thu
            - fri
        - condition: and
          conditions:
          - condition: trigger
            id:
            - weekend_morning_off
          - condition: time
            weekday:
            - sat
            - sun
      sequence:
      - target:
          device_id: b0c54078707a81ed49fa6704ff58e0b2
          area_id: familienbad
        data:
          temperature: 20
          hvac_mode: heat
        action: climate.set_temperature
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: evening_off
      sequence:
      - target:
          device_id: b0c54078707a81ed49fa6704ff58e0b2
          area_id: familienbad
        data:
          hvac_mode: heat
          temperature: 18
        action: climate.set_temperature
  mode: single
