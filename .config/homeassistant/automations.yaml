- id: '1754125179273'
  alias: Multimedia
  description: Power cycle multimedia station
  triggers:
  - at: 00:00:00
    id: midnight
    trigger: time
  - at: 07:00:00
    id: morning
    trigger: time
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: midnight
      sequence:
      - type: turn_off
        device_id: d145863eab5f2012733d31ca4ed7ba55
        entity_id: switch.zigbee_1
        domain: switch
    - conditions:
      - condition: trigger
        id:
        - morning
      sequence:
      - type: turn_on
        device_id: d145863eab5f2012733d31ca4ed7ba55
        entity_id: switch.zigbee_1
        domain: switch
    default: []
  mode: single
- id: '1754419808619'
