name: Configure
on:
  push:
  pull_request:
jobs:
  release:
    if: github.ref == 'refs/heads/nightly'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup git-user
        env:
          GIT_USER_NAME: "GitHub Actions Runner"
          GIT_USER_EMAIL: "actions@users.noreply.github.com"
        run: |
          git config --global user.name "${GIT_USER_NAME}"
          git config --global user.email "${GIT_USER_EMAIL}"
          git fetch --all
      - name: Configure dotfiles and install third-party dependencies
        run: rm ~/.bashrc ~/.profile && ./configure -i
      - name: Deploy and tag
        run: |
          DATE=$(date --utc +%Y-%m-%d_%H-%M-%S)
          git tag --annotate "${DATE}" --message="Version ${DATE}"
          git push --tags
